<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>نظام توثيق الأداء — جمعية فرقان</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>جمعية فرقان لتحفيظ القرآن الكريم</h1>
      <div class="sub">نظام توثيق الأداء</div>

      <form id="loginForm">
        <div class="field">
          <label for="username">اسم المستخدم</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">كلمة السر</label>
          <div class="pw-wrap">
            <input type="password" id="password" required autocomplete="current-password" />
            <button type="button" class="pw-toggle" onclick="togglePassword('password', this)">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn" id="loginBtn">تسجيل الدخول</button>
        <div class="error-msg" id="loginError"></div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const errBox = document.getElementById("loginError");
      errBox.style.display = "none";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      setBtnBusy(btn, true, "جارِ الدخول...");
      try {
        const data = await callApi("login", { username, password });
        // data.user = { name, role, section, unit, jobTitle, directManager }
        saveSession(data.user);

        // التوجيه حسب الدور
        if (data.user.role === "وحدة") {
          window.location.href = "unit.html";
        } else if (data.user.role === "قسم") {
          window.location.href = "department.html";
        } else if (data.user.role === "إدارة") {
          window.location.href = "education.html";
        } else {
          window.location.href = "unit.html";
        }
      } catch (err) {
        errBox.textContent = err.message || "اسم المستخدم أو كلمة السر غير صحيحة";
        errBox.style.display = "block";
      } finally {
        setBtnBusy(btn, false);
      }
    });
  </script>
</body>
</html>
